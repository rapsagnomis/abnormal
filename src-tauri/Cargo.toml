[package]
name = "abnormal"
version = "0.1.0"
description = "Analyse and compare the sonic characteristics of songs"
authors = ["Simon Gaspar"]
edition = "2024"

[lib]
name = "abnormal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["deezer"]
# Deezer search and downloads through Deemix (`deemix.rs`). Leave it out of builds shared with
# others (`--no-default-features`): distributing a Deezer downloader is a ToS/copyright exposure.
deezer = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "pcm", "aiff", "isomp4", "aac", "alac"] }
cpal = "0.18"
rubato = "5"
ebur128 = "0.1.10"
realfft = "3.5.0"
rustfft = "6"
ureq = { version = "2", features = ["json", "cookies"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
flacenc = { version = "0.5", default-features = false, features = ["par"] }
mp3lame-encoder = { version = "0.3", features = ["std"] }
zip = { version = "9", default-features = false, features = ["time"] }

# Files opened from Explorer start a second instance: it hands them to the running one instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Bookmarks, to find a session's files again after a rename or move (`relink.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }

# Decoding/DSP is painfully slow without optimisation, even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
