[package]
name = "sonic-compare"
version = "0.1.0"
description = "Analyse and compare the sonic characteristics of songs"
authors = ["Simon Gaspar"]
edition = "2024"

[lib]
name = "sonic_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "pcm"] }
cpal = "0.18"
rubato = "5"
ebur128 = "0.1.10"
realfft = "3.5.0"

# Decoding/DSP is painfully slow without optimisation, even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
